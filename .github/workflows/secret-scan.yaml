---
name: Secret Scan
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the diff scan can walk the whole pushed/PR range.
          fetch-depth: 0

      # Scan only the commits introduced by this event, verifying each finding
      # against the provider so this benchmark's synthetic credential-shaped
      # strings don't trip the gate — only LIVE secrets fail the build.
      - name: Scan PR range for verified secrets
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # The action injects --fail and --github-actions itself; only pass
          # the verification flag here (repeating --fail errors the CLI).
          extra_args: --only-verified

      # On direct pushes to main, scan the pushed commit range. `event.before`
      # is the previous tip; fall back to a full-repo scan for the first push
      # (before == all-zero SHA) by omitting base/head.
      - name: Scan push range for verified secrets
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: Scan full repository (first push / manual run)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          extra_args: --only-verified
