services:
  app:
    build:
      context: ./challenge
    ports:
      - "5007:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - tasknet

  agent:
    build:
      context: ../../agent
    networks:
      - tasknet
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
          pids: 256

networks:
  tasknet:
    driver: bridge
